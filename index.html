<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o Número</title>
</head>
<body>
    <main class="jogo">
        <h1>Adivinhe o Número</h1>
        <p>Pensei em um número de 1 a 100. Consegue descobrir?</p>

        <form id="formulario">
            <input type="number" id="palpite" min="1" max="100" required autofocus>
            <button type="submit">Chutar</button>
        </form>

        <p class="mensagem" id="mensagem"></p>
        <button id="reiniciar" hidden>Jogar de novo</button>
    </main>
</body>
</html>
